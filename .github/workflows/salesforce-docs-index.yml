name: Salesforce Docs Index

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the generated index to Firebase Storage
        required: false
        default: false
        type: boolean
      min_developer_records:
        description: Minimum developer.salesforce.com records required before success
        required: false
        default: '110'
        type: string
      min_full_text_records:
        description: Minimum full-text documentation records required before success
        required: false
        default: '185'
        type: string
      min_pdf_records:
        description: Minimum official Salesforce PDF records required before success
        required: false
        default: '15'
        type: string
      max_metadata_only_ratio:
        description: Maximum allowed ratio of metadata-only documentation records
        required: false
        default: '0.05'
        type: string
      runner_label:
        description: Runner label. Use salesforce-docs-ingestion for scheduled ingestion; ubuntu-latest is a canary only.
        required: false
        default: salesforce-docs-ingestion
        type: choice
        options:
          - salesforce-docs-ingestion
          - ubuntu-latest
      upload_mode:
        description: Upload mode. Use google-auth for scheduled ingestion; gcloud is a local runner fallback only.
        required: false
        default: google-auth
        type: choice
        options:
          - google-auth
          - gcloud
  schedule:
    - cron: '15 16 * * 1-5'

jobs:
  build-index:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_label || 'salesforce-docs-ingestion' }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    env:
      UPLOAD_REQUESTED: ${{ github.event_name == 'schedule' || inputs.upload == true }}
      MIN_DEVELOPER_RECORDS: ${{ inputs.min_developer_records || '110' }}
      MIN_FULL_TEXT_RECORDS: ${{ inputs.min_full_text_records || '185' }}
      MIN_PDF_RECORDS: ${{ inputs.min_pdf_records || '15' }}
      MAX_METADATA_ONLY_RATIO: ${{ inputs.max_metadata_only_ratio || '0.05' }}
      SALESFORCE_DOCS_ALLOW_CURL_FETCH: '1'
      SALESFORCE_DOCS_ALLOW_CURL_PDF_FETCH: '1'
      UPLOAD_MODE: ${{ inputs.upload_mode || 'google-auth' }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Verify upload credentials
        if: env.UPLOAD_REQUESTED == 'true' && env.UPLOAD_MODE == 'google-auth'
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" && -z "$GOOGLE_SERVICE_ACCOUNT_JSON" && ( -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" || -z "$GCP_SERVICE_ACCOUNT" ) ]]; then
            echo "FIREBASE_SERVICE_ACCOUNT, raw GOOGLE_SERVICE_ACCOUNT_JSON, or both GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT are required when upload is requested with google-auth." >&2
            exit 1
          fi

      # Credentials are prepared even when upload is off: every build reads the
      # stored index (learned pages, unresolved misses) and the lookup miss log.
      - name: Prepare Google auth credentials from service account JSON
        if: env.UPLOAD_MODE == 'google-auth' && (env.FIREBASE_SERVICE_ACCOUNT != '' || env.GOOGLE_SERVICE_ACCOUNT_JSON != '')
        run: |
          credentials_path="$RUNNER_TEMP/salesforce-docs-index-gcp.json"
          if [[ -n "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials_path"
          else
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$credentials_path"
          fi
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));" "$credentials_path"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_path" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud with Workload Identity
        if: env.UPLOAD_MODE == 'google-auth' && env.FIREBASE_SERVICE_ACCOUNT == '' && env.GOOGLE_SERVICE_ACCOUNT_JSON == '' && (env.UPLOAD_REQUESTED == 'true' || env.GCP_WORKLOAD_IDENTITY_PROVIDER != '')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Build Salesforce docs index
        run: |
          upload_flag="--no-upload"
          if [[ "$UPLOAD_REQUESTED" == "true" ]]; then
            upload_flag="--upload"
          fi

          npm --prefix functions run salesforce-docs:index -- \
            --out /tmp/salesforce-docs-index-v1.json \
            "$upload_flag" \
            --upload-mode "$UPLOAD_MODE" \
            --min-developer-records "$MIN_DEVELOPER_RECORDS" \
            --min-full-text-records "$MIN_FULL_TEXT_RECORDS" \
            --min-pdf-records "$MIN_PDF_RECORDS" \
            --max-metadata-only-ratio "$MAX_METADATA_ONLY_RATIO"

      - name: Upload generated index artifact
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-docs-index-v1
          path: /tmp/salesforce-docs-index-v1.json
          if-no-files-found: error

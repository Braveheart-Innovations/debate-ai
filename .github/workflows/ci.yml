name: Continuous Integration

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - name: App quality gate
        run: npm run check:app

      # The process simulator's tests run SimPy (the sandbox template's pin).
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install SimPy
        run: python -m pip install simpy==4.1.2

      - name: Functions quality gate
        run: npm run check:functions

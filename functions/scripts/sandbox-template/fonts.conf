<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Symposium house fonts as the generic defaults, so anything Chromium renders in the
     sandbox (Plotly image export, great_tables) matches the report. Noto CJK covers
     glyphs the Latin faces lack. Installed as /etc/fonts/local.conf. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Noto Sans CJK JP</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Inter</family><family>Noto Sans CJK JP</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Source Serif 4</family><family>Noto Serif CJK JP</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>Noto Sans Mono CJK JP</family></prefer>
  </alias>
</fontconfig>
